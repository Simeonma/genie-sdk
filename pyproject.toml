[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "genie-sdk"
version = "1.0.0a3"
description = "GENIE SDK v2 — build photonic FDTD simulations in Python, submit them to cloud GPUs, and keep results plus custom post_analyze in one portable .gensim document; local Studio included"
# PEP 639 SPDX form requires setuptools>=77; LICENSE ships with the repo and the wheel.
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    # Wire-format models (genie_protocol is embedded at build time; see tool.setuptools package-dir)
    "pydantic>=2,<3",
    "numpy>=1.24",
    # Result reading (genie-results-h5/1: the SimData behind f.results() / post_analyze)
    "h5py>=3.0",
    # Material fitting (curve_fit for fit_nk — lazy import, but a hard prerequisite)
    "scipy>=1.10",
]

[project.scripts]
genie = "genie.host.cli:main"

# Packaging whitelist (the explicit v2 package list guards against accidental
# inclusion); package-dir: the source directory genie-sdk maps to the import
# name genie (distribution name genie-sdk ≠ import name genie); protocol is
# embedded — the SDK wheel carries genie_protocol so a source install needs
# nothing else (v1 precedent; the server side can still use the standalone
# genie-protocol wheel, whose source of truth is the protocol/ subdirectory).
[tool.setuptools]
packages = ["genie", "genie.core", "genie.core.model", "genie.core.archive",
            "genie.core.material", "genie.core.results",
            "genie.core.orchestration",
            "genie.ipc", "genie.net", "genie.worker", "genie.session",
            "genie.host", "genie_protocol"]
package-dir = { genie = "genie-sdk", genie_protocol = "protocol/genie_protocol" }

# Package data: the n-k material library yml files (the source of truth for
# fit_nk / mat_from_nk) and the Studio GUI shell served by host/app.py
# (_STATIC_ROOT = genie/static). Without the static patterns the wheel ships
# no GUI and `genie studio` answers 404 on `/` — the release gate in
# tools/publish.py now blocks that. static/MODMAP.md is internal and stays out.
[tool.setuptools.package-data]
genie = ["resources/materials/*.yml",
         "static/*.js", "static/*.html", "static/*.css",
         "static/modules/*.js", "static/views/*.js",
         "static/vendor/*.js", "static/vendor/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

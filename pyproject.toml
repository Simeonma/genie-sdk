[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "genie-sdk"
version = "2.0.1a4"
description = "GENIE SDK v2 — build photonic FDTD simulations in Python, submit them to cloud GPUs, and keep results plus custom post_analyze in one portable .gensim document; local Studio included"
# PEP 639 SPDX form requires setuptools>=77; LICENSE ships with the repo and the wheel.
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    # Wire-format models. 独立分发包 genie-protocol（与 SDK 同批出轮子），
    # 不再内嵌: 内嵌会让同一份 genie_protocol/ 在两颗轮子里各有一份，
    # 装包顺序决定最终加载哪份协议，且没有任何报错。版本与 protocol/ 同步。
    "genie-protocol==2.0.1a4",
    "pydantic>=2,<3",
    "numpy>=1.24",
    # Result reading (genie-results-h5/1: the SimData behind f.results() / post_analyze)
    "h5py>=3.0",
    # Material fitting (curve_fit for fit_nk — lazy import, but a hard prerequisite)
    "scipy>=1.10",
    # Agent adapter (genie.agent — the MCP server behind `genie mcp`). A main
    # dependency on purpose, no extra: an extra's failure mode is silent (the
    # SDK installs, the agent then reports "not found") — Q6.6.
    "mcp>=2",
]

[project.scripts]
genie = "genie.host.cli:main"

# Packaging whitelist (the explicit v2 package list guards against accidental
# inclusion); package-dir: the source directory genie-sdk maps to the import
# name genie (distribution name genie-sdk ≠ import name genie). protocol 不在
# 本清单里——它是独立分发包（dependencies 钉版本），轮子里不带副本。
[tool.setuptools]
packages = ["genie", "genie.core", "genie.core.model", "genie.core.archive",
            "genie.core.material", "genie.core.results",
            "genie.core.orchestration", "genie.core.param",
            "genie.ipc", "genie.net", "genie.worker", "genie.session",
            "genie.host", "genie.agent"]
package-dir = { genie = "genie-sdk" }

# Package data: the n-k material library yml files (the source of truth for
# fit_nk / mat_from_nk), the Studio GUI shell served by host/app.py
# (_STATIC_ROOT = genie/static), and the agent skill text (genie/agent/SKILL.md
# — the adapter ships with its skill so an agent runtime can read it offline).
# Without the static patterns the wheel ships no GUI and `genie studio` answers
# 404 on `/` — the release gate in tools/publish.py now blocks that.
# static/MODMAP.md is internal and stays out.
[tool.setuptools.package-data]
genie = ["resources/materials/*.yml",
         "static/*.js", "static/*.html", "static/*.css",
         "static/modules/*.js", "static/views/*.js",
         "static/vendor/*.js", "static/vendor/*.md",
         "agent/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

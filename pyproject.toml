[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "genie-sdk"
version = "2.0.5a1"
description = "GENIE SDK v2 — build photonic FDTD simulations in Python, submit them to cloud GPUs, and keep results plus custom post_analyze in one portable .gensim document; local Studio included"
# PEP 639 SPDX form requires setuptools>=77; LICENSE ships with the repo and the wheel.
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    # Wire format: this wheel carries a copy as top-level genie_protocol/
    # (see [tool.setuptools] below), so users install one package. There is
    # also a standalone genie-protocol wheel for the kernel / gateway, which
    # do not install the SDK — but it is deliberately NOT a dependency here:
    # declaring it would put two owners of genie_protocol/ in the same
    # environment, and install order would silently decide which copy wins
    # (2026-11-11 V100 incident; genie_protocol.__init__ now refuses that).
    "pydantic>=2,<3",
    "numpy>=1.24",
    # Result reading (genie-results-h5: the SimData behind results()/post_analyze)
    "h5py>=3.0",
    # Agent adapter (genie.agent — the MCP server behind `genie mcp`). A main
    # dependency on purpose, no extra: an extra's failure mode is silent (the
    # SDK installs, the agent then reports "not found") — Q6.6.
    "mcp>=2",
    # Studio native window (2026-11-22, owner's decision A): pywebview wraps the same
    # static GUI in a WebView2 window; `genie studio --browser` keeps the old
    # server-in-a-browser mode (dev self-test).
    "pywebview>=6,<7",
]

[project.scripts]
genie = "genie.host.cli:main"

# Packaging whitelist (the explicit v2 package list guards against accidental
# inclusion); package-dir maps the two source roots to their import names:
# genie-sdk/ → genie, protocol/genie_protocol → genie_protocol. The wire
# protocol source lives in exactly one place (protocol/); this wheel carries a
# byte-identical copy (2026-11-23, owner's decision), while the standalone genie-protocol
# wheel is built from the same source for the kernel / gateway.
[tool.setuptools]
packages = ["genie", "genie.core", "genie.core.model", "genie.core.archive",
            "genie.core.material", "genie.core.results",
            "genie.core.orchestration", "genie.core.param",
            "genie.ipc", "genie.net", "genie.worker", "genie.session",
            "genie.host", "genie.agent", "genie_protocol"]
package-dir = { genie = "genie-sdk", genie_protocol = "protocol/genie_protocol" }

# Package data: the n-k material library yml files (the source of truth for
# fit_nk / mat_from_nk), the Studio GUI shell served by host/app.py
# (_STATIC_ROOT = genie/static), and the agent skill text (genie/agent/SKILL.md
# — the adapter ships with its skill so an agent runtime can read it offline).
# Without the static patterns the wheel ships no GUI and `genie studio` answers
# 404 on `/` — the release gate in tools/publish.py now blocks that.
# static/MODMAP.md is internal and stays out.
[tool.setuptools.package-data]
genie = ["resources/materials/*.yml",
         "static/*.js", "static/*.html", "static/*.css",
         "static/modules/*.js", "static/views/*.js",
         "static/vendor/*.js", "static/vendor/*.md",
         "agent/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

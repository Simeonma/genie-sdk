[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "genie-protocol"
version = "2.0.0b3"
description = "GENIE wire-format protocol layer - SimConfig models, expression evaluator, resolver, estimator (single source shared by SDK client, gateway and compute kernel)"
requires-python = ">=3.10"
dependencies = [
    # _wire/resolve are pydantic v2 models; expr is pure stdlib (lazy import,
    # does not pull pydantic).
    # 2.0.0b1 breaking: sweep_expand/errors moved into genie-sdk (Q7.1);
    #   timeout retired (Q7.2).
    # 2.0.0b2 batch (released 2026-11-05): run.gpu renamed to n_gpu (Q7.4) +
    #   comment cleanup; the gateway-side batch endpoints are NOT in protocol
    #   (HTTP body shapes live in genie-service).
    # 2.0.0b3 (released 2026-11-05): Q7.5 — monitor field defaults
    #   (time/freq = 'all', index = 'both') + down_sample moved from
    #   _MonitorMixin down to TimeMonSpec (freq/index carrying it = 422 at
    #   validation).
    "pydantic>=2,<3",
]
license = "Apache-2.0"
# The license text ships with the package (2026-10-25): the a1 wheel carried
# only a License-Expression and no LICENSE file, so an installed copy amounted
# to a bare SPDX identifier. The protocol layer is an independently
# distributed package and needs its own copy of the text.
license-files = ["LICENSE"]

# The protocol layer = an independent distribution identity (its own wheel /
# version); the source lives in the SDK repo's protocol/ subdirectory (next
# to the JS mirror, keeping changes atomic — see docs/ARCHITECTURE.md,
# "Protocol layer").
[tool.setuptools]
packages = ["genie_protocol"]

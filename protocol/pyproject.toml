[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "genie-protocol"
version = "2.0.1a1"
description = "GENIE wire-format protocol layer - SimConfig models, expression evaluator, resolver, estimator (single source shared by SDK client, gateway and compute kernel)"
requires-python = ">=3.10"
dependencies = [
    # _wire/resolve are pydantic v2 models; expr is pure stdlib (lazy import,
    # does not pull pydantic).
    # 2.0.0b1 breaking: sweep_expand/errors moved into genie-sdk (Q7.1);
    #   timeout retired (Q7.2).
    # 2.0.0b2 batch (released 2026-11-05): run.gpu renamed to n_gpu (Q7.4) +
    #   comment cleanup; the gateway-side batch endpoints are NOT in protocol
    #   (HTTP body shapes live in genie-service).
    # 2.0.0b3 (released 2026-11-05): Q7.5 — monitor field defaults
    #   (time/freq = 'all', index = 'both') + down_sample moved from
    #   _MonitorMixin down to TimeMonSpec (freq/index carrying it = 422 at
    #   validation).
    # 2.0.0b4 (released 2026-11-07): Q13 — built-in constants pi / c0 / eps0 /
    #   mu0 in the expression dialect (a parameter of the same name wins); the
    #   expression-slot entry itself lives in the SDK's model layer (Q13).
    # 2.0.0b5 (2026-11-07): Q14 — kind="rational" pole (num=(a0,a1,a2),
    #   den=(b0,b1), i.e. χ(s)=(a0+a1s+a2s²)/(s²+b1·s+b0)); lorentz/drude
    #   become the shorthand forms of it and reject num/den, the rational form
    #   rejects omega_0/omega_p/gamma/delta_eps (no silent drops). a2 is a
    #   feedthrough term — applied through the raster-time ε_eff, NOT folded
    #   into eps_inf, so α≠β (instantaneous non-reciprocal) stays legal.
    #   Breaking: a shorthand pole that carried the *other* strength field
    #   (lorentz with omega_p / drude with omega_0) was silently ignored and
    #   now fails loudly.
    # 2.0.0b6 (2026-11-09, unreleased): solver-selection surface —
    #   `solver` (open set: a lower-case identifier, deliberately NOT a Literal
    #   so adding an algorithm does not bump the protocol) and `plan`
    #   (list[PlanStageSpec]: solver/id/consumes) on SimConfig, with three
    #   shape invariants (mutually exclusive, non-empty, ids unique +
    #   consumes only earlier stages). Both default to None → every existing
    #   payload validates byte-identically. "solver declared but not installed
    #   here" is a deployment fact, rejected by the consumer (kernel: 400 +
    #   available list), not by the protocol.
    # 2.0.1a1 (2026-11-11, BREAKING — Q17 nested house): SimConfig
    #   restructured to {model: {materials, geometry, parameters},
    #   solver|plan, config: <solver envelope>, run: {n_gpu}}. domain/mesh/
    #   source/monitor belong to the fdtd solver (FdtdConfigSpec) — the
    #   flat legacy payload is fdtd posing as the model and is now 422.
    #   ModeConfigSpec (ex kernel-private ModeSection) enters the wire;
    #   plan stages carry their own config ({solver, id, consumes,
    #   config}); n_gpu moved to the top-level run (orchestration, any
    #   solver may use it). Model-section guards (dup materials/geometry,
    #   material refs) moved into ModelSpec; monitor-name uniqueness and
    #   boundary pairing into FdtdConfigSpec. Solver set stays open —
    #   unknown solvers' config passes through as a dict (deployment
    #   fact).
    "pydantic>=2,<3",
]
license = "Apache-2.0"
# The license text ships with the package (2026-10-25): the a1 wheel carried
# only a License-Expression and no LICENSE file, so an installed copy amounted
# to a bare SPDX identifier. The protocol layer is an independently
# distributed package and needs its own copy of the text.
license-files = ["LICENSE"]

# The protocol layer = an independent distribution identity (its own wheel /
# version); the source lives in the SDK repo's protocol/ subdirectory (next
# to the JS mirror, keeping changes atomic — see docs/ARCHITECTURE.md,
# "Protocol layer").
[tool.setuptools]
packages = ["genie_protocol"]

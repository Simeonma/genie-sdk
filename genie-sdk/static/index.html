<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GENIE OPTICS — GPU-Empowered Nanophotonic Intelligent Engine</title>
  <link rel="stylesheet" href="/static/style.css">
  <!-- favicon / 顶栏标记 = 20-market 品牌（2026-11-22 站长拍）：
       static/brand/ 是**部署产物**（母版在 20-market/brand/identity/source/），
       换品牌时从母版复制，不在这里改几何。 -->
  <link rel="icon" href="/static/brand/favicon.ico" sizes="any">
</head>
<body>
  <!-- 登录闸（2026-10-21 站长裁决：未登录什么都不给做）。
       未登录时铺满整窗、挡住工作区；登录框浮在它上面。数据侧同一道闸在
       server.py 的 require_signin 中间件里（未带 X-API-Key 一律 401）。 -->
  <div id="auth-gate" class="auth-gate hidden" role="dialog" aria-modal="true"
       aria-label="Sign in required">
    <div class="auth-gate-inner">
      <svg class="auth-gate-mark" width="42" height="38" viewBox="68 86 376 340"
           aria-hidden="true"><path d="M 238 86 A 170 170 0 0 0 238 426 Z" fill="#1E2A38"/><path d="M 274 86 A 170 170 0 0 1 274 426" fill="none" stroke="#A8B6C2" stroke-width="26"/><circle cx="352" cy="256" r="30" fill="#9E3D2E"/></svg>
      <div class="auth-gate-brand">GENIE-OPTICS</div>
      <div class="auth-gate-note">Sign in to open the studio</div>
    </div>
  </div>
  <datalist id="mat-names"></datalist>

  <!-- 动作钮停放区（main-layout 之外）：dock render 清场时「当前头部
       用不到」的收养钮暂存于此（移动模式 3D 激活时 download-py 等），
       面板切回时再被头部收养——boot 按 id 接线永不悬空 -->
  <div id="dock-action-parking" hidden></div>


  <!-- ── Top Bar ── -->
  <header id="topbar">
    <div class="logo">
      <!-- 品牌标记（20-market final7：左实心半圆 + 镜面缝 + 右空心弧 + 弁柄红点）。
           viewBox 收紧到图形本体（68,86–444,426），17px 下不留大片空边。 -->
      <svg width="18" height="17" viewBox="68 86 376 340" aria-hidden="true"><path d="M 238 86 A 170 170 0 0 0 238 426 Z" fill="#1E2A38"/><path d="M 274 86 A 170 170 0 0 1 274 426" fill="none" stroke="#A8B6C2" stroke-width="26"/><circle cx="352" cy="256" r="30" fill="#9E3D2E"/></svg>
      <span>GENIE-OPTICS</span>
      <span class="logo-full">GPU-Empowered Nanophotonic Intelligent Engine</span>
    </div>
      <div class="topbar-actions">
      <!-- status-badge 已删（M1）：静态「未连接」纯误导——登录态由
           #login-toggle 按钮回显（=用户名）。 -->
      <a href="/manual/" target="_blank" class="helplink">手册</a>
      <button id="login-toggle" class="hdr-btn" aria-haspopup="dialog" aria-expanded="false">Connect</button>
    </div>
  </header>

  <nav id="tab-bar" role="tablist" aria-label="功能区">
    <button class="app-tab" id="tab-file" type="button" role="tab" data-page="file"
      aria-selected="false" aria-controls="page-file" tabindex="-1">File</button>
    <button class="app-tab" id="tab-view" type="button" role="tab" data-page="view"
      aria-selected="false" aria-controls="page-view" tabindex="-1">View</button>
    <button class="app-tab" id="tab-design" type="button" role="tab" data-page="design"
      aria-selected="true" aria-controls="page-design" tabindex="0">Design</button>
    <button class="app-tab" id="tab-fdtd" type="button" role="tab" data-page="fdtd"
      aria-selected="false" aria-controls="page-fdtd" tabindex="-1">FDTD</button>
    <button class="app-tab" id="tab-mode" type="button" role="tab" data-page="mode"
      aria-selected="false" aria-controls="page-mode" tabindex="-1">MODE</button>
    <!-- Agent（站长裁决 2026-10-19）：与 FDTD 同级——页签行右端，非页面页签
         故独立类 .tab-action（不入 TABS 激活逻辑） -->
    <button id="agent-open-btn" class="tab-action" type="button" title="Agent 对话面板">
      <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 2 L9.6 6.4 L14 8 L9.6 9.6 L8 14 L6.4 9.6 L2 8 L6.4 6.4 Z"/>
      </svg><span>Agent</span>
    </button>
  </nav>

  <!-- 连接设置对话框（由 modules/boot.js connDialog 动态构建；
       M1 账号密码登录：本地代理上游 /api/auth/login 换 token 存
       localStorage（genie_v2_api_key），提交经同一收敛链） -->

  <!-- 功能区页签（2026-10-17 站长裁决：对齐 Lumerical 2025 R2 的
       FILE / VIEW / DESIGN / FDTD 四页签，独立一行；ribbon 随页签切换，
       页内每组单行、内容顶对齐、组名钉底——单行组不再"掉到第二行"） -->

  <!-- 仿真要素横条（2026-08-31bk：站长裁决——域/网格/材料/几何是仿真
       重要信息, 置于顶部横条而非左栏上方） -->
  <div id="workspace-bar">
      <!-- ══ FILE：空壳（L-35 清空；文件功能随 M6/L-41 重接）══ -->
      <div class="obj-toolbar tb-page" id="page-file" role="tabpanel"
           aria-labelledby="tab-file" hidden>
      </div>

      <!-- ══ VIEW：脸的摆法 + 3D 显示开关（原 Layout 组 + 场景工具钮镜像）══ -->
      <div class="obj-toolbar tb-page" id="page-view" role="tabpanel"
           aria-labelledby="tab-view" hidden>
        <div class="tb-box" id="tb-layout-box">
          <span class="tb-box-title">Layout</span>
          <div class="tb-box-btns">
            <div class="tb-menu-wrap">
              <button id="dock-layout-btn" class="tb-btn tb-menu-btn" type="button" data-preview="layout"
                aria-haspopup="menu" aria-expanded="false" aria-label="工作台布局">
                <span id="dock-layout-label">Default</span>
              </button>
              <div id="dock-layout-menu" class="tb-menu hidden" role="menu"
                aria-label="布局预设"></div>
            </div>
          </div>
        </div>
        <div class="tb-box" id="tb-view-box">
          <span class="tb-box-title">Scene</span>
          <div class="tb-box-btns" id="tb-view-btns"></div>
        </div>
      </div>

      <!-- ══ DESIGN：Material + Structures（Lumerical DESIGN=建模） ══ -->
      <div class="obj-toolbar tb-page" id="page-design" role="tabpanel"
           aria-labelledby="tab-design">
        <div class="tb-box" id="tb-mat-box">
          <span class="tb-box-title">Materials</span>
          <div class="tb-box-btns" id="tb-mat-btns"></div>
        </div>
        <div class="tb-box" id="tb-geo-box">
          <span class="tb-box-title">Structures</span>
          <div class="tb-box-btns" id="tb-geo-btns"></div>
        </div>
        <div class="tb-box" id="tb-solver-box">
          <span class="tb-box-title">Solver</span>
          <div class="tb-box-btns" id="tb-solver-btns"></div>
        </div>
        <div class="tb-box" id="tb-ana-box">
          <span class="tb-box-title">Analysis</span>
          <div class="tb-box-btns" id="tb-ana-btns"></div>
        </div>
      </div>

      <!-- ══ FDTD：源 + 监视器 + Run（Lumerical FDTD=仿真侧；域/网格入口在左树）══ -->
      <div class="obj-toolbar tb-page" id="page-fdtd" role="tabpanel"
           aria-labelledby="tab-fdtd" hidden>
        <div class="tb-box" id="tb-mesh-box">
        <span class="tb-box-title">Mesh</span>
        <div class="tb-box-btns" id="tb-mesh-btns"></div>
      </div>
      <div class="tb-box" id="tb-src-box">
          <span class="tb-box-title">Sources</span>
          <div class="tb-box-btns" id="tb-src-btns"></div>
        </div>
        <div class="tb-box" id="tb-mon-box">
          <span class="tb-box-title">Monitors</span>
          <div class="tb-box-btns" id="tb-mon-btns"></div>
        </div>
        <div class="tb-box tb-run-box" id="tb-run-box">
          <span class="tb-box-title">Simulation</span>
          <div class="tb-box-btns" id="tb-fdtd-run-btns"></div>
        </div>
      </div>

      <!-- ══ MODE：mode 求解器页（2026-11-24 站长拍：与 FDTD 同级；声明后才显示）══ -->
      <div class="obj-toolbar tb-page" id="page-mode" role="tabpanel"
           aria-labelledby="tab-mode" hidden>
        <div class="tb-box tb-run-box" id="tb-mode-run-box">
          <span class="tb-box-title">Simulation</span>
          <div class="tb-box-btns" id="tb-mode-run-btns"></div>
        </div>
      </div>

      <!-- Ribbon 右端遥测条（2026-10-21）：模型的"仪器读数"——域尺寸 / 对象数 /
           材料数。只读信息，不是按钮；放在 ribbon 右端把那半屏留白读作"留白"
           而不是"没做完"。窄窗（<1180px）隐藏，让位给组内容。 -->
      <div id="ribbon-meta" class="ribbon-meta" aria-hidden="true"></div>
  </div>

  <!-- ── 工作台（树 / 检查器 / scene / 代码）── -->
  <div id="main-layout">

    <!-- 结构｜属性 工作面（2026-10 站长裁决：Tree 与 Inspector 恒左右
         同现，结构上就是一个面板——dock 只收养 #struct-panel 一个原件；
         内部 42:58 分割，#struct-split 拖拽调比例，存 genie.struct.ratio） -->
    <div id="struct-panel">
      <aside id="tree-panel">
        <!-- 场景编辑器 v3 P1（2026-09-scene-editor 提案 D1/D2）：
             工具栏=添加入口(Domain/Mesh 单例=编辑)；树=实例；检查器=选中对象 -->
        <div id="obj-tree"></div>
      </aside>
      <div id="struct-split" aria-orientation="vertical"></div>
      <main id="config-panel">
        <div id="config-content"></div>
      </main>
    </div>

    <!-- Col 3: 3D 场景（2026-11-25 起独占右列：Visualize 空模块已摘除） -->
    <div id="scene-panel">
      <div id="scene-stage">
        <div id="three-container"></div>
      <!-- 场景内浮条：视角 / 图层 / 剖面 / 截图（无页签容器；文件面板已随
           v1 遗产删除，.py 编辑归 col4） -->
      <div id="scene-tools" class="scene-tools">
        <!-- 分组（2026-10-21）：视角 → 图层 → 分析 → 输出。分隔线 1px。 -->
        <button class="tool-btn" id="btn-fitcam" title="复位视角" aria-label="复位视角" data-preview="view_fit"></button>
        <button class="tool-btn" id="btn-proj" title="透视 / 正交" aria-label="透视 / 正交" aria-pressed="false" data-preview="view_proj"></button>
        <div class="tool-sep" aria-hidden="true"></div>
        <button class="tool-btn active" id="btn-wire" title="结构线框" aria-label="结构线框" aria-pressed="true" data-preview="view_wire"></button>
        <button class="tool-btn active" id="btn-ruler" title="边框坐标" aria-label="边框坐标" aria-pressed="true" data-preview="view_ruler"></button>
        <button class="tool-btn" id="btn-xray" title="X 光（结构半透明）" aria-label="X 光" aria-pressed="false" data-preview="view_xray"></button>
        <button class="tool-btn" id="btn-grid" title="参考网格" aria-label="参考网格" aria-pressed="false" data-preview="view_grid"></button>
        <div class="tool-sep" aria-hidden="true"></div>
        <button class="tool-btn" id="btn-sec" title="剖面切片" aria-label="剖面切片" aria-pressed="false" data-preview="view_section"></button>
        <div class="tool-sep" aria-hidden="true"></div>
        <button class="tool-btn" id="btn-shot" title="截图" aria-label="截图" data-preview="view_shot"></button>
      </div>
      <!-- 剖面控制板：贴浮条左侧弹出（top 由 JS 对齐到"剖面"按钮） -->
      <div id="sec-panel" class="sec-panel hidden" role="group" aria-label="剖面控制">
        <div class="sec-axes">
          <button type="button" class="sec-ax" data-axis="x" aria-pressed="false">X</button>
          <button type="button" class="sec-ax" data-axis="y" aria-pressed="false">Y</button>
          <button type="button" class="sec-ax is-on" data-axis="z" aria-pressed="true">Z</button>
        </div>
        <input type="range" id="sec-pos" class="sec-pos" min="0" max="100" value="50"
               aria-label="剖面位置">
      </div>
      </div><!-- /scene-stage -->
    </div><!-- /scene-panel -->

    <!-- Visualize/Plot 面（2026-11-25 摘除）：空模块占 58% 宽度且空态指向已删的
         「新建 Plot」（inspector.js:47）。M8/L-43 重建时按面板页签形态加回，
         不要复活空态教程。作业进度 chip 改住 Terminal 头（dock 收养）。 -->

    <!-- 工作区文件面板已删（2026-11-24 清理）：上传/列表是 v1 遗产，
         Import 随 L-11（API 动词先行）重做 -->

    <!-- Col 4: Python SDK 代码（唯一视图；2026-10 站长裁决：JSON 视图
         整体移除——线格式是生成物不是工作面） -->
    <!-- 面板动作钮暂存区（dock 统一头收养；原件全局唯一） -->
    <div id="panel-actions-staging" hidden>
      <div id="result-chip" class="hidden"></div>
      <button id="run-py" class="mini icon-btn primary" type="button" data-icon="run"
        title="Run — executes in the Terminal session (f.run submits)"
        aria-label="Run script"></button>
      <!-- load-py / download-py 归脚本面板头（2026-10 站长裁决：语义
           针对 script，不随文件 I/O 上收）；import-cfg/export-cfg/
           导出会话记录功能已删（2026-10 站长裁决：不重要） -->
      <button id="load-py" class="mini icon-btn" type="button" data-icon="upload"
        title="Open a .py from your computer" aria-label="Open script file"></button>
      <button id="download-py" class="mini icon-btn" type="button" data-icon="download"
        title="Download .py" aria-label="Download script"></button>
      <button id="term-stop" class="mini" type="button" data-icon="stop"
        title="停止当前执行" aria-label="停止当前执行" hidden></button>
      <!-- R31：清理重启（进程级兜底）——停止投不进（死循环/无控制台）
           时杀 worker 重起：只清执行态，模型与终端历史保留 -->
      <button id="term-reset" class="mini" type="button" data-icon="refresh"
        title="清理重启会话（停止无效时使用；模型与历史保留）"
        aria-label="清理重启会话" hidden></button>
      <!-- 清屏：只清可见输出，不碰会话环与 since 游标（刷新后按环回放恢复） -->
      <button id="term-clear" class="mini" type="button"
        title="清屏（只清可见输出；会话历史保留）" aria-label="清屏">Clear</button>
    </div>
    <div id="json-panel">
      <div id="py-view">
        <!-- 代码面：textarea 可编辑（行号 gutter 见 boot 接线） -->
        <div id="pycode" class="pycode" aria-label="Python SDK code (editable)" role="region">
          <div id="code-wrap" class="code-card">
            <textarea id="code-editor" class="code-editor" spellcheck="false"
              aria-label="Python SDK code (editable)"></textarea>
          </div>
        </div>
      </div>
      <div id="term-split" aria-orientation="horizontal" role="separator"
           aria-label="拖拽调整脚本/终端高度"></div>
      <div id="term-dock">
        <!-- 内嵌代码卡：与脚本面板 #code-wrap 同构（白纸面板 + 卡面代码） -->
        <div id="term-card" class="code-card">
          <div id="term-out" aria-live="polite"></div>
          <div id="term-in-row">
            <span id="term-prompt" aria-hidden="true">❯</span>
            <textarea id="term-in" rows="2" spellcheck="false" autocomplete="off"
              aria-label="Terminal 指令输入（Python，直接操作会话 f）"></textarea>
          </div>
        </div>
      </div><!-- /term-dock -->

      <!-- P3 对话面板（v1 遗留，已删除）：Agent 入口只明说「随宿主模式」，
           不再保留一套无接线的死 UI。 -->

    </div>
  </div><!-- /main-layout -->
  <!-- Terminal（terminal 战役，2026-10-10 站长裁决）：主区下半 = 会话
       命令面。三条命令腿同汇 /api/exec：①输入行 ②脚本「运行」整体 exec
       ③工具栏 Run = f.run()。输出流唯一在这里滚；cfg 快照驱动 表单/树/3D
       刷新（SDK/agent 与 terminal 同一执行层）。宽度=3D 中心列（站长裁决：
       terminal 不做全宽，与场景区同宽）。 -->
  <!-- v2 显示模式（2026-10 定案）：DOM 与 v1 逐字节同构——登录框/工具条/
       聊天面板等编辑器官全部保留在页面上，但 app.js 不给它们接线；
       只有显示链路（脚本→会话cfg→树/表单/3D/JSON）是活的。 -->
  <script src="/static/vendor/three.min.js"></script>
  <script src="/static/vendor/OrbitControls.js"></script>
  <!-- 2026-11-22：GUI = ES modules（唯一入口，依赖图由 import 决定）。
       经典 script 只剩 vendor（全局 THREE）。 -->
  <script type="module" src="/static/main.js"></script>
  </body>
</html>
